name: Backfill NEPSE Market Index

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Start date (YYYY-MM-DD, e.g., 2020-01-01)'
        required: true
        default: '2020-01-01'
      end_date:
        description: 'End date (YYYY-MM-DD, e.g., 2021-09-20)'
        required: true
        default: '2021-09-20'
      limit:
        description: 'Max trading days to process in this run (optional, e.g., 300)'
        required: false
        default: ''
      dry_run:
        description: 'Dry run (fetch & parse without modifying Supabase database)'
        required: false
        type: boolean
        default: false

concurrency:
  group: backfill-market-index
  cancel-in-progress: false

jobs:
  backfill:
    name: Backfill Historical market_index
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci || npm install @supabase/supabase-js@^2

      - name: Run Historical Backfill
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          CMD="node scripts/backfill-market-index.mjs --from=${{ inputs.start_date }} --to=${{ inputs.end_date }}"
          if [ -n "${{ inputs.limit }}" ]; then
            CMD="$CMD --limit=${{ inputs.limit }}"
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            CMD="$CMD --dry-run"
          fi
          echo "Executing: $CMD"
          $CMD
